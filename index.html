<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

    <p id="instruction">
        Masukkan suhu derajat celcius (C) ke kota di bawah, lalu klik tombol konversi
        untuk mendapatkan hasil konversi dalam bentuk farenheit (F)
    </p>

    <!-- Input for user temperature -->
    <input type="number" id="inputTemp" placeholder="Enter temperature" />

    <div class="button-group">
        <button id="convertBtn">Convert</button>
        <button id="resetBtn">Reset</button>
        <button id="reverseBtn">Reverse</button>
    </div>

    <!-- Output shown in input-style box, but readonly -->
    <input type="text" id="outputTemp" readonly placeholder="Output will appear here" />

    <div class="calculation" id="calculation"></div>

    <div class="link" id="link">Celcius to farenheit</div>

    <script src="/js/script.js"></script>

</body>
</html>
